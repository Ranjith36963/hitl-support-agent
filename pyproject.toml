[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-support-agent"
version = "0.1.0"
description = "Production-Grade Human-in-the-Loop Customer Support Agent with Evaluation & Durable Execution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Ranjith Maliga Guruprakash", email = "ranjithmaligaguruprakash@gmail.com" },
]
keywords = [
    "langgraph",
    "human-in-the-loop",
    "hitl",
    "customer-support",
    "llm",
    "mcp",
    "agent",
    "slack",
    "gmail",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://github.com/Ranjith36963/hitl-support-agent"
Repository = "https://github.com/Ranjith36963/hitl-support-agent"
Issues = "https://github.com/Ranjith36963/hitl-support-agent/issues"

# Runtime dependencies mirror `requirements.txt`. Required for `python -m build`
# to produce a wheel/sdist that actually installs its deps from PyPI; without
# this block, `pip install hitl-support-agent` from a wheel would install zero
# runtime deps. Container builds still use `requirements.txt` directly (see
# Dockerfile) so the two lists must stay in sync — flagged for a future
# "single source of truth" refactor (e.g. `pip-compile` from pyproject).
dependencies = [
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langsmith>=0.1.140",
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "slack-bolt>=1.21.0",
    "aioimaplib>=1.1.0",
    "aiosmtplib>=3.0.0",
    "slack-sdk>=3.33.0",
    "aiosqlite>=0.20.0",
    "mcp>=1.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "prometheus-client>=0.21.0",
    "pandas>=2.2.0",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
# Install with: pip install -e .[dev]
# Kept out of requirements.txt so Docker images don't ship test + lint tooling.
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
    # httpx is used by eval/_check_or_limits.py and eval/_list_free_models.py
    # (one-off OpenRouter API probes). Currently installed transitively via
    # openai / langsmith; declared here so a future upstream dep drop doesn't
    # silently break the probes. NOT promoted to requirements.txt — these
    # scripts are dev-only and Docker images don't need them.
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "mcp_server*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Eval one-off probes + adversarial fixtures aren't part of the runtime app.
# We skip a couple of lints there to keep the CI signal-to-noise high.
"eval/_*.py" = ["E402", "B008"]
# Tests legitimately use blocking I/O and late-bound imports (after fixture
# definitions for env isolation). Relax the async + import-order rules; keep
# all the others (unused vars, real bugs, etc.).
"tests/*.py" = ["E402", "ASYNC230", "ASYNC240"]

[tool.bandit]
# Bandit findings for files we own and ship in the runtime app. Tests + eval
# scripts often legitimately do things bandit flags (asserts in tests,
# subprocess in MCP launchers) — excluded to keep CI signal clean.
exclude_dirs = ["tests", "eval", "data"]
skips = [
    # B101: assert_used — assert is fine inside src/ guards; this is not
    # security-sensitive use. If a real auth/policy invariant is asserted, we
    # cover it in tests/test_policy.py separately.
    "B101",
]
