# Prometheus scrape config for the local docker-compose stack.
#
# Single scrape target: the hitl-agent service exposes /metrics on port
# 8000 inside the docker network. Compose's DNS resolves the service
# name → container IP, so the URL below is stable across rebuilds.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # External label so multiple environments can be distinguished if
  # alertmanager is added later. "demo" is honest for the portfolio stack.
  external_labels:
    env: demo

scrape_configs:
  - job_name: hitl-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["hitl-agent:8000"]
        labels:
          app: hitl-support-agent
          component: graph-runner
