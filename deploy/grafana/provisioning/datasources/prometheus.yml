# Auto-provision the in-stack Prometheus as Grafana's default datasource.
# Avoids the recruiter having to click through the UI to add it.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
